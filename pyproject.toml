[project]
name = "tela"
dynamic = ["version"]
description = "Tela - a free, open-source web hosting control panel"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess calls are reviewed individually; never shell=True
    "S607",  # system binaries are resolved via PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Site directories need group/other access so the web server can serve them.
"src/tela_agent/actions/websites.py" = ["S103"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
